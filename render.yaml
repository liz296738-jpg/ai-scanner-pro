services:
  - type: web
    name: open-lens
    runtime: static
    buildCommand: sh -c "mkdir -p .render-opencv-src && curl -fsSL -o .render-opencv-src/opencv.js https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.12.0-release.1/dist/opencv.js && cp .render-opencv-src/opencv.js app/public/opencv.js && rm -rf .render-opencv-src && npx bun install && npx bun run build && rm -rf app/public/opencv.js app/node_modules app/dist"
    publishPath: dist
    envVars:
      - key: VITE_PUBLIC_PATH
        value: /